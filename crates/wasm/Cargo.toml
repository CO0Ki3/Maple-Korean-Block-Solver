[package]
name = "moamoa-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "브라우저용 wasm-bindgen 바인딩"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
moamoa-engine = { path = "../engine" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
