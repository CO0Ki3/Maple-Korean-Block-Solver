[workspace]
members = ["crates/engine", "crates/cli", "crates/wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

[profile.release.package."*"]
opt-level = 3

# 테스트/개발 빌드도 엔진은 최적화해서 돌린다 (자기대전이 느리면 디버깅이 힘들다).
[profile.dev.package.moamoa-engine]
opt-level = 2
